name: my_flutter_app
description: A new Flutter project
publish_to: 'none'
version: 0.1.1+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.1.0
  file_picker: ^10.3.7
  firebase_analytics: ^12.0.4
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  firebase_storage: ^13.0.4
  flutter_quill: ^11.5.0
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  google_fonts: ^6.3.3
  http: ^1.6.0
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.2
  sqflite_common_ffi_web: ^0.4.3+1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.1
  uuid: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  syncfusion_flutter_pdf: ^28.1.33

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
